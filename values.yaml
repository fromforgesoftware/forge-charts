# Toggle which platform services deploy. As of 4e all four apps ship console
# remotes loaded by the forge console, so gjallarhorn/gleipnir are enabled too —
# their installed remotes need a running backend to talk to.
aegis: { enabled: true }
talos: { enabled: true }
gjallarhorn: { enabled: true }
gleipnir: { enabled: true }

# Console plugin registry (Grafana-style). `install` lists app plugin bundles the
# forge console fetches + serves; `enable` drives GET /apps (visibility + apiBase).
# These render the `forge-apps` ConfigMap (templates/forge-apps-configmap.yaml).
console:
  # Phase 4e: every first-party app ships a published console bundle (its
  # SystemJS module.js remote), so all four go in install[]. The forge host no
  # longer bundles any compile-time plugin — the console loads each app purely
  # from its remote.
  install:
    - { id: aegis, bundle: "oci://ghcr.io/fromforgesoftware/aegis-console:0.1.0" }
    - { id: talos, bundle: "oci://ghcr.io/fromforgesoftware/talos-console:0.1.0" }
    - { id: gjallarhorn, bundle: "oci://ghcr.io/fromforgesoftware/gjallarhorn-console:0.1.0" }
    - { id: gleipnir, bundle: "oci://ghcr.io/fromforgesoftware/gleipnir-console:0.1.0" }
  enable:
    - { id: aegis, apiBase: "http://aegis" }
    - { id: talos, apiBase: "http://talos" }
    - { id: gjallarhorn, apiBase: "http://gjallarhorn" }
    - { id: gleipnir, apiBase: "http://gleipnir" }

# forge subchart. consoleApps wires the forge pod to the forge-apps ConfigMap:
# the server mounts apps.yaml and reads install[]+enable[]; an oras init-container
# pulls each install[].bundle into the shared plugins volume. configMapName +
# install MUST mirror the console.* values above (and the ConfigMap name).
forge:
  enabled: true
  consoleApps:
    configMapName: forge-apps
    install:
      - { id: aegis, bundle: "oci://ghcr.io/fromforgesoftware/aegis-console:0.1.0" }
      - { id: talos, bundle: "oci://ghcr.io/fromforgesoftware/talos-console:0.1.0" }
      - { id: gjallarhorn, bundle: "oci://ghcr.io/fromforgesoftware/gjallarhorn-console:0.1.0" }
      - { id: gleipnir, bundle: "oci://ghcr.io/fromforgesoftware/gleipnir-console:0.1.0" }
